# Run the test suite, and prove a run leaves the repository alone.
#
# This repo's checks are mostly ratchets. Each lists the debt that exists today
# and fails on anything new:
#
#   tests/test_repo_conventions.py
#     KNOWN_RAW_SAVEFIG, KNOWN_RAW_ANIMATION, KNOWN_UNSEEDED_RNG,
#     KNOWN_UNSEEDED_GENERATOR, KNOWN_PYFLAKES, KNOWN_DIRECT_PLT_SHOW,
#     KNOWN_GLOBAL_RNG_IN_CORE, KNOWN_INTRA_CHAPTER_IMPORTS,
#     KNOWN_NON_EXAMPLE_CHAPTER_FILES, KNOWN_PRESET_OVERRIDES_OUTPUT,
#     KNOWN_UNCOLLECTED_TESTS
#   tests/test_simulated_truth_is_physical.py    KNOWN_DISCONTINUOUS
#   tests/test_lint_debt_only_shrinks.py         BASELINE  (ruff, per rule)
#   tests/test_semantic_api_debt_only_shrinks.py BASELINE
#   tests/test_doctests_that_pass_keep_passing.py  ALLOWLIST
#   tests/test_every_figure_has_a_demo_behind_it.py KNOWN_UNCOMMITTED
#   tests/test_examples_import_this_checkout.py  KNOWN_WITHOUT_CORE
#   tests/ch6_dead_reckoning/test_methods_actually_move.py   KNOWN_FROZEN
#   tests/docs/test_readme_code_blocks.py        FRAGMENT_BLOCKS
#   tests/docs/test_readme_example_output.py     UNCHECKED_TRANSCRIPTS
#   tools/validate_dataset_docs.py               KNOWN_INCOMPLETE
#     (run by tests/test_repo_validators.py)
#
# Not a ratchet but the same idea:
#   tests/test_black_is_actually_run.py -- no debt list, because black passes
#   outright. It is here because black had already regressed twice through a
#   gap where nothing ran it.
#   tests/test_mypy_debt_only_shrinks.py -- no debt list either, since Wave E
#   took core/ to zero. It kept its name and stopped being a ratchet: any mypy
#   error in core/ now fails it outright.
#
# Their entire value is that they run, and until this file there was nothing
# making them run: the audit that emptied two of those lists was merged on the
# strength of one contributor's local pytest.
#
# The list above is spelled out because the version it replaced had already gone
# stale -- it named FRONTEND_IS_KNOWN_NO_OP, which no longer exists anywhere,
# and predated five of the registers now in the tree. It then went stale a
# second time, by three whole files and six registers, because the grep it
# offered as its generator did not match `BASELINE` or `ALLOWLIST` -- so the
# ratchets that name their register something other than KNOWN_* were invisible
# to the command meant to find them. If you add a ratchet, add it here; if you
# retire one, take it out. It is generated by:
#
#   grep -rn \
#     '^\(KNOWN_[A-Z_]*\|FRAGMENT_BLOCKS\|UNCHECKED_TRANSCRIPTS\|BASELINE\|ALLOWLIST\)[ :=]' \
#     --include='*.py' tests/ tools/
#
# That grep over-reports by exactly one: KNOWN_DIAGRAM_TYPES in
# tests/docs/test_chapter_architecture_sections.py is a list of valid mermaid
# diagram types, not a debt register. Do not add it back.
#
# The two validators in tools/ are covered by the pytest run rather than by
# separate steps here, deliberately: a CI-only step would not run on the machine
# where the change is being made, and these two spent their whole existence not
# being run at all.
#
# Author: Li-Ta Hsu

name: tests

on:
  pull_request:
  push:
    branches: [main]

# This repository hands workflow tokens write access by default
# (default_workflow_permissions: write), which this job has no use for -- it
# reads the code and runs pytest. Narrowing it here means a compromised package
# pulled in during `pip install` cannot push to a public repo on the strength of
# a token that happened to be lying around.
permissions:
  contents: read

# A second push to the same PR makes the first run irrelevant. The suite is
# ~10 minutes locally, so not cancelling wastes a lot of runner time.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest

    # The suite takes ~10 min locally and several tests shell out to chapter
    # examples, the slowest at ~135 s. This is a hang guard, not a budget --
    # see tests/ch7_slam/slam_example_runner.py for why a tight limit here
    # buys nothing and costs false failures.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # Editable, matching how the examples are run locally, and via the
        # declared dependencies rather than a hand-listed set -- so a
        # dependency missing from pyproject.toml fails here rather than for
        # the next reader who clones it.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the suite
        env:
          MPLBACKEND: Agg
          # Unbuffered, because a cancelled run is the case where the log is
          # the only evidence there is. Three runs were cancelled at the job
          # limit here, and the first question each time was whether the last
          # file printed was where the run actually stopped. It was -- but
          # establishing that cost a CI cycle, and this makes it free.
          PYTHONUNBUFFERED: "1"
        # -rs reports why each test skipped. The first run of this workflow
        # went green having run 21 fewer tests than a developer machine, because
        # an undeclared scikit-learn made a module skip itself. A green tick on
        # a suite that quietly shrank is worse than a red one, so the skips are
        # printed rather than merely counted.
        run: python -m pytest -q -rs --durations=25

      - name: A test run must leave the working tree clean
        # This repo spent real effort on a phantom: ch7_slam/figs/*.png kept
        # reappearing in git status because the tests wrote their figures into
        # the tracked directory, so every run manufactured a diff and everyone
        # who noticed investigated it as if it were an edit. It is fixed --
        # the SLAM runner points IPIN_FIGS_DIR at scratch -- and this step is
        # what keeps it fixed.
        #
        # Untracked files count too: a figure written to a *new* path is the
        # same defect and `git diff` alone would not see it.
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::The test run modified the working tree."
            echo "Figures belong in IPIN_FIGS_DIR during tests, not in chX/figs."
            git status --porcelain --untracked-files=all
            git diff --stat
            exit 1
          fi
          echo "Working tree clean."
