[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "ch*"]
exclude = ["references*", "data*", "notebooks*"]

[project]
name = "ipin-examples"
version = "0.1.0"
description = "Code examples for IPIN (Indoor Positioning and Indoor Navigation) book"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
authors = [
    {name = "IPIN Book Examples", email = "ipin@example.com"}
]
keywords = ["indoor positioning", "navigation", "SLAM", "sensor fusion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    # 3.9 for Axes.boxplot(tick_labels=...). The old spelling, labels=, was
    # deprecated in 3.9 and *removed* in 3.11, so the examples using it crashed
    # outright on a current install while still only warning on 3.10 -- which
    # is why it went unnoticed locally. The floor said 3.3.0, but one example
    # had already been migrated to tick_labels, so 3.3 had not been buildable
    # for a while.
    "matplotlib>=3.9.0",
    "jupyter>=1.0.0",
    "tqdm>=4.62.0",
    # Required by core/fingerprinting/classification.py, which raises
    # ImportError without it, and so by ch5's example_classification. It was
    # undeclared: it happened to be installed in the development environment,
    # so nothing local noticed, while a reader installing from this file got a
    # chapter example that could not run.
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    # Declared explicitly rather than left to arrive as flake8's transitive
    # dependency: tests/test_repo_conventions.py imports it, and a test whose
    # tool is present only by accident is one that silently skips.
    "pyflakes>=3.0.0",
    # tests/docs/test_notebooks_run.py executes the notebooks in a real kernel.
    # These arrive with the `jupyter` runtime dependency, but are declared here
    # for the same reason pyflakes is: a test whose tool is present only by
    # accident is one that silently skips.
    "nbclient>=0.7.0",
    "nbformat>=5.0.0",
    "ipykernel>=6.0.0",
    # tools/check_equation_index.py parses docs/equation_index.yml, and
    # tests/test_repo_validators.py runs that tool. Same reason again: PyYAML
    # only arrives today as a transitive dependency of jupyterlab, so the
    # equation index is guarded by a package nothing here asks for.
    "PyYAML>=6.0",
    "mypy>=0.950",
    "ruff>=0.1.0",
    "pydocstyle>=6.0.0",
    "pylint>=2.12.0",
]

[tool.black]
line-length = 88
target-version = ['py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["ipin_examples", "core"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.pydocstyle]
convention = "google"
match = '(?!test_).*\.py'
match-dir = '(?!\.git|\.venv|build|dist)'

